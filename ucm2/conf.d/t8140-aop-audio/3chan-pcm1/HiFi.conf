# For laptops with a three-channel mic array on PCM 1 of the T8140-family AOP
# card (J704).

SectionDevice."Mic" {
	Comment "Microphone"

	Value {
		TQ Voice
		CaptureChannels "3"
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		# Unplugged while the lid is closed: the lid disconnects the
		# microphones in hardware.
		JackControl "Internal Mic Jack"
	}
}
