# J704 HiFi verb. The jack DAC volume is the hardware volume (capped at 0 dB by macaudio).

SectionVerb {
	EnableSequence [
		cset "name='Headphone Switch' off"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='Headphone Switch' on"
	]

	DisableSequence [
		cset "name='Headphone Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Jack DAC"
		PlaybackVolume "Jack DAC Playback Volume"
		JackControl "Headphone Jack"
	}
}
